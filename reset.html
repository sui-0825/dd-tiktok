<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D&D 更新</title><body style="font-family:system-ui;background:#061d2c;color:white;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px"><main><h2>アプリを更新しています…</h2><p id="m">少々お待ちください。</p></main><script>(async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.unregister()));const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));document.getElementById('m').textContent='更新完了。アプリを開きます。';setTimeout(()=>location.replace('/dd-tiktok/?v=2573&reset='+Date.now()),700)}catch(e){document.getElementById('m').textContent='更新に失敗しました。ブラウザを閉じてもう一度お試しください。'}})();</script></body></html>
